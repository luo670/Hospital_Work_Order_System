{% extends "base.html" %}
{% block title %}{% if d %}编辑科室{% else %}新增科室{% endif %} - 运维工单系统{% endblock %}
{% block page_title %}{% if d %}编辑科室{% else %}新增科室{% endif %}{% endblock %}

{% block content %}
<div class="card" style="max-width:560px">
  <form method="post" action="{{ url_for('edit_department', did=d.id) if d else url_for('create_department') }}">
    <div class="field">
      <label>科室名称</label>
      <input type="text" name="name" value="{{ d.name if d else '' }}" placeholder="例如：内科" required>
    </div>
    <div class="field">
      <label>说明<span class="hint">可选</span></label>
      <textarea name="description" placeholder="科室简介或位置信息">{{ d.description if d else '' }}</textarea>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-primary" type="submit">保存</button>
      <a href="{{ url_for('departments') }}" class="btn btn-ghost">取消</a>
    </div>
  </form>
</div>
{% endblock %}
