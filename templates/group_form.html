{% extends "base.html" %}
{% block title %}{% if g %}编辑分组{% else %}新增分组{% endif %} - 运维工单系统{% endblock %}
{% block page_title %}{% if g %}编辑分组{% else %}新增分组{% endif %}{% endblock %}

{% block content %}
<div class="card" style="max-width:560px">
  <form method="post" action="{{ url_for('edit_group', gid=g.id) if g else url_for('create_group') }}">
    <div class="field">
      <label>分组名称</label>
      <input type="text" name="name" value="{{ g.name if g else '' }}" placeholder="例如：网络运维组" required>
    </div>
    <div class="field">
      <label>职责说明<span class="hint">可选</span></label>
      <textarea name="description" placeholder="分组负责的工作范围">{{ g.description if g else '' }}</textarea>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-primary" type="submit">保存</button>
      <a href="{{ url_for('groups') }}" class="btn btn-ghost">取消</a>
    </div>
  </form>
</div>
{% endblock %}
